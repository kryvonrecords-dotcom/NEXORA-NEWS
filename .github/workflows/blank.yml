name: Nexora News - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Dar permissão ao Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Verificar projeto Gradle
        working-directory: android
        run: ./gradlew tasks --no-daemon

      - name: Limpar projeto
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Gerar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verificar APK
        run: |
          echo "Procurando APK..."
          find android/app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;

          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERRO: APK Debug não foi gerado."
            exit 1
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-News-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
