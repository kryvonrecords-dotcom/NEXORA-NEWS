name: Deploy Nexora News

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p project
          unzip -q nexora-news.zip -d project

      - name: Encontrar projeto
        run: |
          PACKAGE=$(find project -name "package.json" -type f | head -1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json não encontrado"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        working-directory: ${{ env.PROJECT_DIR }}
        run: bun install --frozen-lockfile

      - name: Criar site
        working-directory: ${{ env.PROJECT_DIR }}
        run: bun run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
